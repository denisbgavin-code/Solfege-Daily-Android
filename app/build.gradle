plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.solfege.daily'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.solfege.daily'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
